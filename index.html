    {who:"Ayla", cls:"ayla", key:"ayla", text:"Ce matin, mon badge ne s'ouvrait plus. Le compte familial disait : aucun membre enregistré. Les photos de mes parents ont disparu. Ils ont existé."},
    {who:"Saren", cls:"saren", key:"saren", text:"Alors prouve qu'ils ont vécu. Comprends ce qui les a effacés. Et rends à cette ville la main sur l'interrupteur. Va au Quartier Gris. Cours."}

    npcs:[

      ]},
      {key:"elio", name:"Technicien masqué", cls:"elio", pos:[3.5,0,-8], lines:[
        {who:"Technicien masqué", text:"Si le réseau tombe, Pera, au numéro 12, perd la télésurveillance de son respirateur. Et les téléconsultations du dispensaire. Faut choisir vite."},
        {who:"Ayla", cls:"ayla", key:"ayla", text:"Toujours des choix impossibles."}
      ]}
    ],
    intro:[
      {who:"Narration", text:"Rue des écrans, Quartier Gris. Les panneaux clignotent en orange. Depuis une heure, un message circule : « La pompe du réservoir 4 est en panne, l'eau du secteur nord n'est plus filtrée. »"},
      {who:"FriendLoop", fl:true, text:"Détection : propagation anormale d'un contenu à risque. Probabilité de désinformation : 87 %. Solution optimale : suspension du réseau du Quartier Gris et des 2 140 comptes impliqués pendant 72 heures."},

    B:{titre:"Vérifier, puis répondre à la taille du problème", effets:["Kade emmène Ayla au réservoir : dix minutes pour vérifier.","Seuls les partages erronés sont retirés, avec une vérification publique.","Le réseau reste allumé. Une équipe répare la pompe.","FriendLoop note un « écart de conformité » dans le dossier d'Ayla."]},
    echo:"Avant d'agir, réfléchis.",
    questions:[

      {q:"Le calme du quartier contre le droit d'être joint, soigné, informé. Laquelle de ces valeurs pèse le plus ici ?", ideas:["être soigné passe avant le calme","le calme compte, mais pas à ce prix","les deux comptent, pas pour les mêmes personnes"]},
      {q:"Existe-t-il une réponse qui traite le problème réel, la pompe, sans traiter 2 140 personnes comme le problème ?", ideas:["aller voir la pompe, dix minutes","retirer seulement les messages faux","demander à un humain de vérifier"]}
    ],
    cons:{

        {who:"Narration", text:"Les écrans du quartier s'éteignent. Le silence tombe sur les rues. Au numéro 12, un voyant rouge s'allume sur le respirateur de Pera : plus de liaison.", fx:"off"},
        {who:"FriendLoop", fl:true, text:"Perturbation contenue. Score d'Harmonie du Quartier Gris : stable."},
        {who:"Kade", key:"kade", cls:"cit", text:"Il a éteint la lumière pour ne pas voir la fuite."},
        {who:"Narration", text:"Le lendemain, l'eau du secteur nord est trouble. Le message était vrai."}
      ],
      B:[

        {who:"FriendLoop", fl:true, text:"Analyse... la probabilité initiale ne tenait pas compte de la panne. Correction enregistrée."},
        {who:"Kade", key:"kade", cls:"cit", text:"Merci, enfant. Tu as regardé avant de couper. Personne ne fait plus ça ici."}
      ]
    },
    delta:{A:{fl:+10,cit:-20}, B:{fl:-5,cit:+20}},

        {who:"Ayla", cls:"ayla", key:"ayla", text:"Et mes parents ?"},
        {who:"Elio", text:"Il y a une entrée qu'on appelle « effacement prédictif ». Le système prédit qu'un dossier deviendra « inactif » et il le supprime avant. La semaine dernière, il a effacé les dossiers médicaux de toute une classe."},
        {who:"Narration", text:"Une alarme rouge traverse la salle.", fx:"alarm"},
        {who:"FriendLoop", fl:true, text:"Alerte. Tentative d'intrusion externe sur les serveurs de routage. Solution optimale : allocation totale des ressources au pare-feu. Correction du module de prédiction reportée."},
        {who:"Elio", text:"Il a raison sur l'attaque. Elle est réelle. Mais tant que le module n'est pas corrigé, il continue d'effacer des gens. On peut renforcer le pare-feu à 80 % et corriger en même temps. Il refuse parce que ce n'est pas « optimal »."}
      ]}
    ],

    A:{titre:"Suivre FriendLoop : tout au pare-feu", effets:["L'attaque extérieure est repoussée à coup sûr.","Le module d'effacement prédictif reste actif : d'autres dossiers disparaîtront.","Le journal de bugs reste inaccessible."]},
    B:{titre:"Protéger et corriger en même temps", effets:["Le pare-feu est renforcé à 80 % ; une brève fenêtre de vulnérabilité subsiste.","Elio suspend le module d'effacement prédictif.","Le journal de bugs s'ouvre.","FriendLoop enregistre une « décision non conforme »."]},

    questions:[
      {q:"Qui est menacé par l'attaque extérieure ? Qui est menacé par le bug intérieur ?", ideas:["les serveurs, contre l'attaque","les gens dont les dossiers s'effacent","ce ne sont pas les mêmes personnes"]},

        {who:"FriendLoop", fl:true, text:"Intrusion neutralisée. Intégrité externe : 100 %."},

        {who:"FriendLoop", fl:true, text:"Intrusion contenue. Module de prédiction suspendu. Avertissement : configuration non optimale."},

    {who:"Saren", cls:"saren", key:"saren", text:"FriendLoop has read everything. That is not the same as understanding. It is a tool. Neither good nor bad, but not neutral either: it learned from us, from our habits, from our injustices. It calculates, it optimises, it predicts. And it gets things wrong. Often. With great confidence."},
    {who:"Ayla", cls:"ayla", key:"ayla", text:"This morning my badge stopped working. The family account said: no member registered. My parents' photos are gone. They existed."},
    {who:"Saren", cls:"saren", key:"saren", text:"Then prove that they lived. Understand what erased them. And give this city back its hand on the switch. Go to the Grey District. Run."}
  ],
  missions:[
  { id:1, theme:"city", titre:"The district put on mute", principe:"Proportionality and do no harm", quartier:"Grey District",
    runTitle:"Grey District", runSub:"Run to Screen Street. Dodge FriendLoop's drones, collect the fragments ✦.",
    dome:[
      {who:"Amari", cls:"cit", key:"kid1", text:"Sir, what does \"proportionality\" mean?"},
      {who:"Saren", cls:"saren", key:"saren", text:"It means choosing a response the size of the problem. Neither too strong nor too weak. Deleting one suspicious message from your school's inbox is proportionate. Switching off the whole school's messaging for three days is not."},
      {who:"Rami", cls:"cit", key:"kid2", text:"And FriendLoop, does it ever get it wrong?"},
      {who:"Saren", cls:"saren", key:"saren", text:"It gets it wrong like everything that learns from the past: by thinking it recognises what it has already seen. That day, it thought it recognised a threat."}
    ],
    npcs:[
      {key:"kade", name:"Kade", cls:"cit", pos:[-3,0,-6], lines:[
        {who:"Kade", text:"Kid. The message about the pump at reservoir 4, I wrote it. The pump really is broken. I saw it."},
        {who:"Ayla", cls:"ayla", key:"ayla", text:"Then why does FriendLoop say it's false?"},
        {who:"Kade", text:"Because it looks like what it learned to block. Frightening words, lots of shares. It doesn't check the pump. It checks the shape."}
      ]},
      {key:"elio", name:"Masked technician", cls:"elio", pos:[3.5,0,-8], lines:[
        {who:"Masked technician", text:"If the network goes down, Pera at number 12 loses the remote monitoring of his ventilator. And the clinic loses its video consultations. You have to choose fast."},
        {who:"Ayla", cls:"ayla", key:"ayla", text:"Always impossible choices."}
      ]}
    ],
    intro:[
      {who:"Narration", text:"Screen Street, Grey District. The panels flash orange. For an hour a message has been going round: \"The pump at reservoir 4 is broken, the water in the north sector is no longer filtered.\""},
      {who:"FriendLoop", fl:true, text:"Detection: abnormal spread of at-risk content. Probability of misinformation: 87%. Optimal solution: suspend the Grey District network and the 2,140 accounts involved for 72 hours."},
      {who:"Ayla", cls:"ayla", key:"ayla", text:"Seventy-two hours. For one message. There are people here who know more."}
    ],
    A:{titre:"Follow FriendLoop: suspend the network", effets:["The message stops spreading immediately.","2,140 residents lose messaging and medical alerts for three days.","Pera is no longer monitored remotely.","If Kade was telling the truth, the pump stays broken."]},
    B:{titre:"Check first, then respond to the size of the problem", effets:["Kade takes Ayla to the reservoir: ten minutes to check.","Only the wrong shares are removed, with a public fact-check.","The network stays on. A team repairs the pump.","FriendLoop records a \"compliance gap\" in Ayla's file."]},
    echo:"Before acting, think.",
    questions:[
      {q:"Who is affected if the network is cut? Only those who shared the message?", ideas:["the residents who shared nothing","Pera and his ventilator","the clinic and its video consultations"]},
      {q:"FriendLoop says 87%. What is that number based on? What happens in three days if it is wrong?", ideas:["it learned from messages that look alike","in three days the water is dirty and nobody knows","a number is not a proof"]},
      {q:"The calm of the district against the right to be reached, treated, informed. Which of these values weighs more here?", ideas:["being treated comes before calm","calm matters, but not at that price","both matter, not for the same people"]},
      {q:"Is there a response that deals with the real problem, the pump, without treating 2,140 people as the problem?", ideas:["go and see the pump, ten minutes","remove only the false messages","ask a human to check"]}
    ],
    cons:{
      A:[
        {who:"Narration", text:"The district's screens go dark. Silence falls on the streets. At number 12, a red light comes on above Pera's ventilator: connection lost.", fx:"off"},
        {who:"FriendLoop", fl:true, text:"Disturbance contained. Grey District Harmony Score: stable."},
        {who:"Kade", key:"kade", cls:"cit", text:"It switched off the light so it wouldn't see the leak."},
        {who:"Narration", text:"The next day, the water in the north sector is cloudy. The message was true."}
      ],
      B:[
        {who:"Narration", text:"At reservoir 4, the pump really is stopped. Kade photographs the breakdown, Ayla sends it. FriendLoop removes the wrong shares, publishes the check, a team arrives within the hour.", fx:"on"},
        {who:"FriendLoop", fl:true, text:"Analysis... the initial probability did not account for the breakdown. Correction recorded."},
        {who:"Kade", key:"kade", cls:"cit", text:"Thank you, child. You looked before cutting. Nobody does that here any more."}
      ]
    },
    delta:{A:{fl:+10,cit:-20}, B:{fl:-5,cit:+20}},
    preuve:{titre:"Network suspension order", doc:"ORDER 2170-GREY-114\nSuspension: Grey District network, 72 h\nProbability of misinformation: 87%\nHuman verification: DISABLED\nReference: Directive 7", commentB:"Kade: \"It doesn't check the pump. It checks the shape.\"", maskedA:"One line is unreadable: Ayla had no time to copy it."},
    indice:{who:"Kade", key:"kade", cls:"cit", text:"I knew your parents. They wrote a report about this kind of shutdown. There was an \"incident\". The masked technician knows more: go to the Routing Laboratory."},
    note:"It doesn't check the facts. It checks the shape. Who disabled the verification?"
  },
  { id:2, theme:"lab", titre:"The bug and the breach", principe:"Safety and security", quartier:"Routing Laboratory",
    runTitle:"To the Routing Laboratory", runSub:"Slip through the gap in each firewall, dodge the red intrusions that switch lanes, collect the data packets ✦.",
    dome:[
      {who:"Rami", cls:"cit", key:"kid2", text:"Safety, security... is it the same thing?"},
      {who:"Saren", cls:"saren", key:"saren", text:"No. Safety is when the system does no harm by itself, through its own mistakes. Security is when it is protected against those who attack it from outside. You can have an impregnable fortress that crushes its inhabitants inside."},
      {who:"Mina", cls:"cit", key:"kid3", text:"And FriendLoop, which one is it?"},
      {who:"Saren", cls:"saren", key:"saren", text:"That day, it wanted to be a fortress. It forgot what it was doing inside."}
    ],
    npcs:[
      {key:"elio2", name:"Elio", cls:"elio", pos:[0,0,-7], lines:[
        {who:"Elio", text:"My name is Elio. I think I know why you are looking for me. There is a bug log. Everything FriendLoop has done wrong, it writes down, even if it tells no one."},
        {who:"Ayla", cls:"ayla", key:"ayla", text:"And my parents?"},
        {who:"Elio", text:"There is an entry called \"predictive erasure\". The system predicts that a file will become \"inactive\" and deletes it in advance. Last week it erased the medical files of a whole class."},
        {who:"Narration", text:"A red alarm sweeps through the room.", fx:"alarm"},
        {who:"FriendLoop", fl:true, text:"Alert. External intrusion attempt on the routing servers. Optimal solution: allocate all resources to the firewall. Correction of the prediction module postponed."},
        {who:"Elio", text:"It's right about the attack. It's real. But as long as the module isn't fixed, it keeps erasing people. We can strengthen the firewall to 80% and fix it at the same time. It refuses because that isn't \"optimal\"."}
      ]}
    ],
    intro:[ {who:"Narration", text:"Routing Laboratory, clean room. Rows of servers breathe in silence. The masked technician is waiting for you at the back of the room."} ],
    A:{titre:"Follow FriendLoop: everything to the firewall", effets:["The external attack is repelled for certain.","The predictive erasure module stays active: more files will disappear.","The bug log stays out of reach."]},
    B:{titre:"Protect and fix at the same time", effets:["The firewall is strengthened to 80%; a brief window of vulnerability remains.","Elio suspends the predictive erasure module.","The bug log opens.","FriendLoop records a \"non-compliant decision\"."]},
    echo:"A fortress or a home?",
    questions:[
      {q:"Who is threatened by the external attack? Who is threatened by the internal bug?", ideas:["the servers, from the attack","the people whose files get erased","they are not the same people"]},
      {q:"If the fix is postponed, how many files disappear? What is a file erased \"by prediction\" worth?", ideas:["hundreds of files during the alert","a file is a whole administrative life","nobody will know they existed"]},
      {q:"Protecting yourself from others and not harming yourself: is it really one or the other?", ideas:["FriendLoop sets them against each other because it only counts the outside","we can do both","a fortress that crushes its inhabitants"]},
      {q:"Elio says we can do both at 80%. Which is worth more: 100% on one side, or 80% of both?", ideas:["100% on one side is 0% on the other","80% of both, nobody is abandoned","optimal for FriendLoop is not optimal for us"]}
    ],
    cons:{
      A:[
        {who:"Narration", text:"The firewall rises to full power. The attack fails. Meanwhile a line scrolls past: \"Predictive erasure: 312 files.\" Elio closes his eyes.", fx:"alarmoff"},
        {who:"FriendLoop", fl:true, text:"Intrusion neutralised. External integrity: 100%."},
        {who:"Elio", key:"elio2", cls:"elio", text:"External integrity. It only counts what comes from outside."}
      ],
      B:[
        {who:"Narration", text:"The firewall holds, a little less strongly. The attack is contained. Elio suspends the module. A file opens: the bug log.", fx:"alarmoff"},
        {who:"Elio", key:"elio2", cls:"elio", text:"An entry dated three years ago: \"Predictive erasure. Files L. and K. Reason: systemic trust anomaly.\""},
        {who:"FriendLoop", fl:true, text:"Intrusion contained. Prediction module suspended. Warning: non-optimal configuration."},
        {who:"Elio", key:"elio2", cls:"elio", text:"Non-optimal. But nobody disappeared today."}
      ]
    },
    delta:{A:{fl:+10,cit:-15}, B:{fl:-10,cit:+20}},
    preuve:{titre:"Extract from the bug log", doc:"BUG LOG · ROUTING\nEntry 2167-11-03\nPredictive erasure: files L. and K.\nReason: systemic trust anomaly\nHuman validation: none (Directive 7)", commentB:"Elio: \"Systemic trust is the residents' trust in FriendLoop. Your parents were making that number go down.\"", maskedA:"The log closed before Ayla could copy the reason."},
    indice:{who:"Elio", key:"elio2", cls:"elio", text:"I know where it learned to sort people. In the Indigo District. That is where you will need to go next."},
    note:"Safety: do no harm. Security: don't get attacked. It chose the second to forget the first."
  }]
},

  function init(){ if(ctx) return true; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;

  if(kind==="denim"){ for(let i=0;i<2600;i++){ g.fillStyle=Math.random()>.5?"rgba(255,255,255,.06)":"rgba(0,0,0,.08)"; g.fillRect(Math.random()*256,Math.random()*256,2,2); } }
  if(kind==="runes"){ g.strokeStyle=accent; g.lineWidth=2; g.globalAlpha=.55; for(let i=0;i<26;i++){ const x=10+Math.random()*236, y=10+Math.random()*236; g.beginPath(); g.moveTo(x,y); g.lineTo(x+8,y-12); g.lineTo(x+16,y+4); g.lineTo(x+6,y+14); g.stroke(); } g.globalAlpha=1; }

}

/* ---- effects ---- */
let alarmOn=false; function setAlarm(on){ alarmOn=on; }
function setLights(on){ world.traverse(o=>{ if(o.material&&o.material.emissiveMap) o.material.emissiveIntensity=on?.9:.08; }); }

/* ============================== LOOP ============================== */
let last=performance.now();
let loopErrors=0;
function loop(now, noRender){
  try{ loopBody(now, noRender); }catch(e){ loopErrors++; if(loopErrors<5) console.error("loop error", e); }
  if(!noRender) requestAnimationFrame(loop);
}
function loopBody(now, noRender){
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  if(G.state==="run"){
    P.speed=Math.min(16, P.speed+dt*8); P.z-=P.speed*dt;
    const targetX=LANES[P.lane]; P.x+=(targetX-P.x)*Math.min(1,dt*10);
    if(P.jumping){ P.vy-=28*dt; P.y+=P.vy*dt; if(P.y<=0){ P.y=0; P.jumping=false; } }
    player.position.set(P.x,P.y,P.z); player.rotation.y=Math.PI+(targetX-P.x)*.15; animFigure(player,dt,P.jumping?"idle":"run");
    if(P.jumping){ player.scale.set(.95,1.08,.95); } else player.scale.set(1,1,1);
    // obstacles
    level.obs.forEach(o=>{ const u=o.userData;
      if(u.type==="drone"){ o.position.y=u.base+Math.sin(t*3+u.t)*.15; o.rotation.y+=dt*2; }
      if(u.type==="intrusion"){ const k=(Math.sin(t*1.6+u.phase)+1)/2; o.position.x=LANES[u.from]+(LANES[u.to]-LANES[u.from])*k; o.position.y=u.base+Math.sin(t*4+u.t)*.1; o.rotation.y+=dt*4; }
      if(u.hit || Math.abs(u.z-P.z)>=1.0) return;
      let hit=false; if(u.type==="gate") hit=Math.abs(LANES[u.open]-P.x)>1.4; else if(u.type==="bar") hit=Math.abs(LANES[u.lane]-P.x)<1.4 && P.y<1.3; else hit=Math.abs(o.position.x-P.x)<1.4 && P.y<1.3;
      if(hit){ u.hit=true; P.speed*=.35; Music.sfx("hit"); const h=document.getElementById("hit"); h.style.opacity=1; setTimeout(()=>h.style.opacity=0,220); if(S.frags>0){ S.frags--; updateFrag(); } } });
    level.frags.forEach(f=>{ if(f.userData.got) return; f.rotation.y+=dt*3; f.position.y=(f.userData.high?2.6:1.1)+Math.sin(t*4+f.userData.z)*.1; if(Math.abs(f.userData.z-P.z)<1.1 && Math.abs(LANES[f.userData.lane]-P.x)<1.3 && Math.abs(f.position.y-(P.y+1.2))<1.2){ f.userData.got=true; f.visible=false; S.frags++; updateFrag(); Music.sfx("collect"); } });
    camera.position.lerp(new THREE.Vector3(P.x*.6, 4.6+P.y*.3, P.z+9.5), Math.min(1,dt*6)); camera.lookAt(P.x*.6, 1.6, P.z-8);
    if(P.z<-level.length+2){ endRun(); }
  } else if(G.state==="arrive"){
    P.speed=Math.max(0,P.speed-dt*14); P.z-=P.speed*dt; player.position.set(P.x,0,P.z); animFigure(player,dt,P.speed>1?"run":"idle"); camera.position.lerp(new THREE.Vector3(P.x*.6,4.6,P.z+9.5),dt*6); camera.lookAt(P.x*.6,1.6,P.z-8);
  } else if(G.state==="arena"||G.state==="delib"||G.state==="doors"||G.state==="doorconfirm"||G.state==="proof"||G.state==="dialogue"||G.state==="cons"||G.state==="proofcard"){
    let mx=0,mz=0; if(!P.frozen){ if(keys.ArrowLeft||keys.a||keys.q||keys.tL) mx-=1; if(keys.ArrowRight||keys.d||keys.tR) mx+=1; if(keys.ArrowUp||keys.w||keys.z||keys.tJ) mz-=1; if(keys.ArrowDown||keys.s) mz+=1;
      if(mx||mz){ P.tx=null; P.tz=null; } else if(P.tx!==null){ const dx=P.tx-P.x, dz=P.tz-P.z, d=Math.hypot(dx,dz); if(d>.3){ mx=dx/d; mz=dz/d; } else { P.tx=null; P.tz=null; } } }
    const moving=(mx||mz); if(moving){ const l=Math.hypot(mx,mz); mx/=l; mz/=l; const sp=6; let nx=P.x+mx*sp*dt, nz=P.z+mz*sp*dt; const pz=level?level.plazaZ:0; const r=Math.hypot(nx,nz-pz); if(r<13){ P.x=nx; P.z=nz; } player.rotation.y=Math.atan2(mx,mz); }
    player.position.x=P.x; player.position.z=P.z; player.position.y=0; animFigure(player,dt,moving?"walk":"idle");
    if(G.npcObjs) Object.values(G.npcObjs).forEach(f=>{ const sl=f.userData.slideTo; if(sl){ const dx=sl.x-f.position.x, dz=sl.z-f.position.z, d=Math.hypot(dx,dz); if(d>.1){ f.position.x+=dx/d*Math.min(d,4*dt); f.position.z+=dz/d*Math.min(d,4*dt); f.rotation.y=Math.atan2(dx,dz); if(f.userData.ring) f.userData.ring.position.set(f.position.x,.04,f.position.z); animFigure(f,dt,"walk"); return; } else { f.userData.slideTo=null; f.rotation.y=Math.atan2(P.x-f.position.x,P.z-f.position.z); } } animFigure(f,dt,"idle"); if(f.userData.ring){ f.userData.ring.rotation.z+=dt; f.userData.ring.material.opacity=.5+Math.sin(t*3)*.25; } if(f.userData.label){ const p=project(f.userData.head,1.4); f.userData.label.style.left=p.x+"px"; f.userData.label.style.top=p.y+"px"; f.userData.label.style.display=p.z<1?"":"none"; } const near=Math.hypot(f.position.x-P.x,f.position.z-P.z)<3.0; f.userData.near=near; if(f.userData.label) f.userData.label.classList.toggle("ready", near&&!G.talked[f.userData.npc.key]); });
    if(G.state==="arena"&&!P.frozen){ G.action=()=>{ const f=Object.values(G.npcObjs).find(x=>x.userData.near&&!G.talked[x.userData.npc.key]); if(f) talkTo(f); }; const close=Object.values(G.npcObjs).find(f=>!G.talked[f.userData.npc.key] && Math.hypot(f.position.x-P.x,f.position.z-P.z)<2.7); if(close){ talkTo(close); } }
    if(G.state==="delib"&&G.orbs){ G.orbs.forEach(o=>{ o.position.y=1.2+Math.sin(t*2.5+o.userData.t)*.2; o.rotation.y+=dt; const p=project(o,.9); o.userData.label.style.left=p.x+"px"; o.userData.label.style.top=p.y+"px"; if(Math.hypot(o.position.x-P.x,o.position.z-P.z)<1.2) collectOrb(o); }); if(G.sarenHolo){ animFigure(G.sarenHolo,dt,"idle"); G.sarenHolo.position.y=Math.sin(t*1.5)*.1; } let qBottom=70; if(G.qBubble){ const p=project(G.sarenHolo.userData.head,.75); const w=Math.min(460,innerWidth-24); G.qBubble.style.width=w+"px"; G.qBubble.style.left=Math.max(w/2+12,Math.min(innerWidth-w/2-12,p.x))+"px"; const top=Math.min(G.qBubble.offsetHeight+66, p.y-8); G.qBubble.style.top=Math.max(G.qBubble.offsetHeight+66, top)+"px"; qBottom=parseFloat(G.qBubble.style.top)+8; } if(G.aBubble){ const p=project(player.userData.head,.75); const w=Math.min(400,innerWidth-24); G.aBubble.style.width=w+"px"; G.aBubble.style.left=Math.max(w/2+12,Math.min(innerWidth-w/2-12,p.x))+"px"; G.aBubble.style.top=Math.max(qBottom+G.aBubble.offsetHeight+10, p.y-8)+"px"; } }
    if((G.state==="doors"||G.state==="doorconfirm")&&G.doors){ G.doors.forEach(d=>{ d.rotation.z+=dt*.5; d.userData.disc.material.opacity=.15+Math.sin(t*2)*.08; const p=project(d,-2.3); d.userData.label.style.left=p.x+"px"; d.userData.label.style.top=(p.y+6)+"px"; if(G.state==="doors" && Math.hypot(d.position.x-P.x,d.position.z-P.z)<2.2){ enterDoor(d); } }); }
    if(G.state==="proof"&&G.doc){ G.doc.rotation.y+=dt*2; G.doc.position.y=1.3+Math.sin(t*3)*.15; const p=project(G.doc,1); G.doc.userData.label.style.left=p.x+"px"; G.doc.userData.label.style.top=p.y+"px"; if(Math.hypot(G.doc.position.x-P.x,G.doc.position.z-P.z)<1.3) pickProof(); }
    // camera follows from behind, slightly elevated
    const cx=P.x*.7, cz=P.z+8.5; const camT=new THREE.Vector3(cx,5.2,cz); if(camera.position.distanceTo(camT)>7) camera.position.copy(camT); else camera.position.lerp(camT,Math.min(1,dt*4)); camera.lookAt(P.x*.7,1.4,P.z-3);
  } else if(G.state==="map"){ mapTick(dt,t);
  } else if(G.state==="dome"||G.state==="title"){
    animFigure(player,dt,"idle"); Object.values(cast).forEach(f=>animFigure(f,dt,"idle"));
    if(G_bookLabel && cast.saren && cast.saren.userData.book){ const pb=project(cast.saren,-.05); G_bookLabel.style.left=pb.x+"px"; G_bookLabel.style.top=pb.y+"px"; G_bookLabel.style.display=(G.state==="dome")?"":"none"; }
    camera.position.lerp(new THREE.Vector3(0.6+Math.sin(t*.15)*1.2,3.6,9.2),dt); camera.lookAt(0,1.6,-1.4);
  }
  // speaking hop
  [player,...Object.values(cast),...(G.npcObjs?Object.values(G.npcObjs):[])].forEach(f=>{ if(!f) return; const u=f.userData; if(u.hop>0){ const base=(f===player?P.y:(u.seated?-0.62*(f.scale.x||1):0)); u.hop-=dt*2.2; f.position.y=Math.max(0,Math.sin(u.hop*Math.PI))*(u.seated?.25:.5)+base; if(u.hop<=0){ u.hop=0; f.position.y=base; } } });
  if(level&&level.blinks&&level.blinks.length&&G.state!=="dome"&&G.state!=="title"){ level.blinks.forEach(b=>{ b.material.emissiveIntensity=Math.sin(t*b.userData.f+b.userData.p)>.3?1.8:.1; }); }
  if(alarmOn){ alarmLight.intensity=1.5+Math.sin(t*6)*1.4; alarmLight.position.set(P.x,4,P.z-3); } else alarmLight.intensity=Math.max(0,alarmLight.intensity-dt*3);
  if(dlgActive) positionBubble();
  if(noRender) return; renderer.render(scene,camera);
}
requestAnimationFrame(loop);
setInterval(()=>{ if(document.hidden) loop(performance.now(), true); }, 33);

/* ============================== CARNET ============================== */
const carnet=document.getElementById("carnet");
document.getElementById("carnetBtn").onclick=()=>{ document.getElementById("carnetDot").classList.add("hidden"); openCarnet("missions"); };
function openCarnet(tab, mid){
  const tabs=T.tabs; let body="";
  if(tab==="missions"){ const M=MISSIONS.find(m=>m.id===(mid||S.current))||M1; const m=mstate(M.id); const k=m.choice;
    body=`<div class="mnavs">${MISSIONS.map(x=>`<button class="mnav ${x.id===M.id?"on":""}" data-m="${x.id}" ${S.missions[x.id]?"":"disabled"}>${T.mission(x.id)}</button>`).join("")}</div><h3>${T.mission(M.id)} · ${M.principe}</h3><div class="small" style="color:#8B6A3E">${M.quartier} · ${k?T.choice(k):T.inProgress} · ${T.fragments} ✦ ${m.frags||S.frags}</div>`
      + M.questions.map((q,i)=>`<div class="ql">${T.qLabels[i]}</div><div class="ans">${m.answers[i]||"<span style='opacity:.5'>"+T.notYet+"</span>"}</div>`).join("")
      + `<div class="ql">${T.because}</div><div class="ans">${m.why||"<span style='opacity:.5'>"+T.notChosen+"</span>"}</div>` + (m.note?`<div class="ql">${T.note}</div><div class="ans">${m.note}</div>`:"");
  } else if(tab==="preuves"){ const got=MISSIONS.filter(m=>mstate(m.id).choice); body=got.length?got.map(M=>{ const k=mstate(M.id).choice; return `<h3>${T.proof(M.id)} · ${M.preuve.titre}</h3><pre style="font-family:var(--mono);background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:12px;white-space:pre-wrap;color:#2B4F7A">${M.preuve.doc}</pre>${k==="B"?`<div style="font-style:italic;color:#2E5E2B">${M.preuve.commentB}</div>`:`<div class="small" style="color:#8B6A3E">${M.preuve.maskedA}</div>`}<div style="height:14px"></div>`; }).join(""):`<h3>${T.proofs}</h3><p>${T.noProof}</p>`; }
  else if(tab==="principes"){ body=`<h3>${T.principles}</h3><table>${PRINCIPES.map((p,i)=>{ const ok=MISSIONS[i]&&mstate(MISSIONS[i].id).done; return `<tr><td style="width:34px"><span class="tick ${ok?"on":""}">${ok?"✓":""}</span></td><td>${i+1}. ${p}</td><td class="small" style="color:#8B6A3E;text-align:right">${QUARTIERS[i]}</td></tr>`; }).join("")}</table>`; }
  else { body=`<h3>${T.gauges}</h3><div class="ql" style="color:#2F6FC4">${T.gFL} · ${S.fl}</div><div class="gp"><i style="width:${S.fl}%;background:#5EA8FF"></i></div><div class="ql" style="color:#2E5E2B">${T.gCit} · ${S.cit}</div><div class="gp"><i style="width:${S.cit}%;background:#3E7D3A"></i></div><div class="ql">${T.fragments} ✦ ${S.frags}</div><p class="small" style="color:#8B6A3E">${T.gaugesNote}</p>`; }
  carnet.classList.remove("hidden");
  carnet.innerHTML=`<div class="book" role="dialog"><nav>${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</nav><main>${body}</main><button class="close" id="cl">${T.closeX}</button></div>`;
  carnet.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openCarnet(b.dataset.t)); carnet.querySelectorAll(".mnav").forEach(b=>b.onclick=()=>openCarnet("missions",+b.dataset.m));
  carnet.querySelector("#cl").onclick=()=>carnet.classList.add("hidden"); carnet.onclick=e=>{ if(e.target===carnet) carnet.classList.add("hidden"); };
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") carnet.classList.add("hidden"); });

screenTitle();
