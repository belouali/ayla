<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayla et FriendLoop</title>
<meta name="description" content="Conte-jeu sur l'éthique de l'intelligence artificielle. Prototype : prologue et mission 1.">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#0A1020; --bg2:#101A30; --panel:#141F36; --panel2:#1B2846; --line:#2B3B5E;
  --ink:#EAF0FA; --muted:#93A3C2;
  --fl:#5EA8FF; --fl-glow:rgba(94,168,255,.55); --fl-dim:rgba(94,168,255,.14);
  --ayla:#E8A24A; --ayla-dim:rgba(232,162,74,.18);
  --cit:#6FCF97; --cit-dim:rgba(111,207,151,.16);
  --dome:#9B7BD6; --dome-dim:rgba(155,123,214,.2);
  --danger:#E06060;
  --paper:#FFF6E5; --paper2:#F3E4C8; --paper-ink:#3A2A14;
  --display:"Exo 2", "Segoe UI", Arial, sans-serif;
  --body:"Nunito", "Segoe UI", Arial, sans-serif;
  --mono:"Share Tech Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ayla);outline-offset:2px}

/* ---------- stage & parallax world ---------- */
#stage{position:fixed;inset:0;perspective:1100px;overflow:hidden;background:radial-gradient(1200px 700px at 50% 20%, #17264A 0%, var(--bg) 60%)}
.world{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .12s ease-out}
.layer{position:absolute;left:-10%;right:-10%;bottom:0;height:70%;transform-style:preserve-3d}
.layer svg{width:100%;height:100%;display:block}
.l1{transform:translateZ(-600px) scale(1.55);opacity:.45}
.l2{transform:translateZ(-300px) scale(1.28);opacity:.7}
.l3{transform:translateZ(0)}
.grid{position:absolute;left:-40%;right:-40%;bottom:-8%;height:46%;transform:rotateX(64deg);transform-origin:50% 100%;
  background:
    linear-gradient(to top, rgba(94,168,255,.28), rgba(94,168,255,0) 70%),
    repeating-linear-gradient(90deg, rgba(94,168,255,.22) 0 2px, transparent 2px 90px),
    repeating-linear-gradient(0deg, rgba(94,168,255,.22) 0 2px, transparent 2px 70px);
  background-size:100% 100%, 100% 100%, 100% 140px; animation:gridmove 6s linear infinite}
@keyframes gridmove{from{background-position:0 0,0 0,0 0}to{background-position:0 0,0 0,0 140px}}
.core{position:absolute;left:50%;top:14%;width:220px;height:220px;margin-left:-110px;border-radius:50%;
  background:radial-gradient(circle, #BFE0FF 0 8%, var(--fl) 9% 16%, rgba(94,168,255,.35) 17% 40%, rgba(94,168,255,0) 70%);
  filter:blur(.2px);animation:pulse 4s ease-in-out infinite;transform:translateZ(-450px) scale(1.4)}
@keyframes pulse{0%,100%{opacity:.75;transform:translateZ(-450px) scale(1.4)}50%{opacity:1;transform:translateZ(-450px) scale(1.5)}}
.haze{position:absolute;inset:0;background:linear-gradient(to top, rgba(10,16,32,.85) 0%, rgba(10,16,32,0) 45%)}
.dome-sky{position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 110%, #2A1F4E 0%, #120E26 55%, #0A0818 100%)}
.dome-arc{position:absolute;left:50%;bottom:22%;width:1400px;height:700px;margin-left:-700px;border-radius:700px 700px 0 0;border:2px solid rgba(155,123,214,.5);
  background:linear-gradient(to top, rgba(155,123,214,.22), rgba(155,123,214,0));box-shadow:0 0 80px rgba(155,123,214,.25) inset}
.dome-arc.inner{width:1000px;height:500px;margin-left:-500px;border-style:dashed;opacity:.6}

/* ---------- characters (rayman-like: head, body, floating hands) ---------- */
.chars{position:absolute;left:0;right:0;bottom:24%;height:280px;pointer-events:none;transform-style:preserve-3d}
.char{position:absolute;bottom:0;width:150px;height:260px;transform-style:preserve-3d;animation:bob 3.2s ease-in-out infinite}
.char.right{animation-delay:1.1s}
.char svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 20px rgba(0,0,0,.55))}
.char .hand{animation:hand 2.6s ease-in-out infinite;transform-origin:center}
.char .hand.r{animation-delay:.6s}
.char .name{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.char.speaking svg{filter:drop-shadow(0 18px 20px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,255,255,.35))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes hand{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,-8px) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){.char,.char .hand,.core,.grid{animation:none}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;pointer-events:none;z-index:20}
.chip{pointer-events:auto;white-space:nowrap;background:rgba(20,31,54,.8);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);backdrop-filter:blur(6px)}
.phases{display:flex;gap:0;pointer-events:auto;background:rgba(20,31,54,.8);border:1px solid var(--line);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px)}
.ph{display:flex;flex-direction:column;align-items:center;width:92px;font-size:10px;color:var(--muted);letter-spacing:.04em}
.ph i{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);display:block;margin-bottom:4px}
.ph.done i{background:var(--muted)}
.ph.on{color:var(--ink)} .ph.on i{border-color:var(--ayla);background:var(--ayla);box-shadow:0 0 12px var(--ayla)}
.ph small{opacity:.7}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(900px, calc(100% - 140px));z-index:15}
.bubble{background:rgba(20,31,54,.92);border:1px solid var(--line);border-radius:18px;padding:18px 22px 16px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(8px);
  transform-style:preserve-3d;animation:rise .35s ease-out;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bubble .who{font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.bubble .txt{font-size:18px;line-height:1.5}
.bubble .hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:right;font-style:italic}
.bubble.fl{border-color:var(--fl);background:linear-gradient(180deg, rgba(94,168,255,.16), rgba(20,31,54,.94));box-shadow:0 0 0 1px rgba(94,168,255,.25), 0 0 40px var(--fl-glow)}
.bubble.fl .who{color:var(--fl)} .bubble.fl .txt{font-family:var(--mono);font-size:16px;color:#CFE4FF}
.bubble.echo{border-color:var(--dome);background:linear-gradient(180deg, rgba(155,123,214,.2), rgba(20,31,54,.94))}
.bubble.echo .who{color:var(--dome)} .bubble.echo .txt{font-style:italic}
.who.ayla{color:var(--ayla)} .who.cit{color:var(--cit)} .who.saren{color:var(--dome)} .who.elio{color:#B8C7E6}

/* ---------- panels (dilemma, deliberation, etc.) ---------- */
.panel{position:fixed;inset:70px 0 0 0;z-index:14;display:flex;flex-direction:column;align-items:center;padding:20px 24px 110px;overflow:auto;background:linear-gradient(180deg, rgba(10,16,32,.55), rgba(10,16,32,.86) 30%);backdrop-filter:blur(3px)}
.panel h2{font:800 clamp(18px,2.4vw,26px) var(--display);margin:8px 0 4px;text-align:center;text-wrap:balance;max-width:900px}
.panel .sub{color:var(--muted);text-align:center;max-width:820px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(280px,440px));gap:26px;perspective:1200px;width:100%;justify-content:center}
.card{position:relative;background:linear-gradient(160deg, #1E2C4E, #131E36);border:1px solid var(--line);border-radius:18px;padding:20px 22px;transform-style:preserve-3d;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s, opacity .3s;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:left}
.card .letter{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font:800 15px var(--display);margin-right:10px;transform:translateZ(30px)}
.card h3{display:inline;font:800 17px var(--display);vertical-align:middle}
.card ul{margin:14px 0 0;padding-left:20px;line-height:1.5}
.card li{margin:6px 0;color:#D7E0F0}
.card.inactive{opacity:.85;border-style:dashed}
.card.active{cursor:pointer}
.card.active:hover,.card.active:focus-visible{transform:translateZ(40px) rotateX(4deg);border-color:#4A5F8F}
.card.chosen{transform:translateZ(60px) translateY(-8px);border-color:var(--ayla);box-shadow:0 0 0 2px var(--ayla), 0 30px 70px rgba(0,0,0,.6), 0 0 50px var(--ayla-dim)}
.card.dim{opacity:.5;transform:translateZ(-30px)}
.banner{margin:24px 0 10px;background:var(--dome-dim);border:1px solid var(--dome);color:#D9CCF6;border-radius:999px;padding:10px 22px;font-weight:700}
.btn{border:0;border-radius:12px;padding:14px 26px;font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#0A1020;background:var(--ayla);box-shadow:0 10px 30px rgba(232,162,74,.35);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(232,162,74,.45)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.fl{background:var(--fl);box-shadow:0 10px 30px var(--fl-glow)}
.btn.dome{background:var(--dome);box-shadow:0 10px 30px rgba(155,123,214,.4);color:#fff}
.btn.cit{background:var(--cit);box-shadow:0 10px 30px rgba(111,207,151,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.q{width:min(900px,100%);background:rgba(20,31,54,.9);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.q .n{font:800 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--fl)}
.q h3{font:800 21px var(--display);margin:8px 0 4px;line-height:1.3}
.q .help{color:var(--muted);font-style:italic;margin:0 0 12px}
textarea,input[type=text]{width:100%;background:#0E1730;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:400 17px var(--body);resize:vertical;min-height:120px}
textarea:focus,input:focus{border-color:var(--fl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{background:var(--fl-dim);color:#CFE4FF;border:1px solid rgba(94,168,255,.4);border-radius:999px;padding:7px 14px;font-size:13px}
.timer{height:5px;background:#1B2846;border-radius:3px;margin:16px 0 8px;overflow:hidden}
.timer i{display:block;height:100%;width:0;background:var(--fl);transition:width 1s linear}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.gauges{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.g{background:rgba(20,31,54,.92);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.g .lab{font:800 12px var(--display);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.g .bar{height:14px;border-radius:7px;background:#0E1730;margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.g .bar i{display:block;height:100%;width:50%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.g.fl .lab{color:var(--fl)} .g.fl .bar i{background:linear-gradient(90deg,#2F6FC4,var(--fl));box-shadow:0 0 14px var(--fl-glow)}
.g.cit .lab{color:var(--cit)} .g.cit .bar i{background:linear-gradient(90deg,#3A8F5F,var(--cit));box-shadow:0 0 14px rgba(111,207,151,.5)}
.delta{font-family:var(--mono);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(5,8,16,.7);display:grid;place-items:center;z-index:40;backdrop-filter:blur(4px)}
.modal .box{background:var(--panel2);border:1px solid var(--ayla);border-radius:18px;padding:26px 30px;max-width:460px;width:calc(100% - 40px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font:800 22px var(--display);margin:0 0 6px}

/* ---------- proof card & carnet ---------- */
.proof{width:min(520px,100%);background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:18px 20px;box-shadow:0 30px 60px rgba(0,0,0,.6);border:2px solid var(--ayla);transform-style:preserve-3d;animation:flip .8s ease-out}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.proof.fly{animation:fly 1.1s cubic-bezier(.4,0,.8,.2) forwards}
@keyframes fly{to{transform:translate(38vw,36vh) scale(.08) rotate(20deg);opacity:0}}
.proof .t{font:800 14px var(--display);color:#9A5A12;letter-spacing:.06em;text-transform:uppercase}
.proof pre{font-family:var(--mono);font-size:13px;background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:12px;margin:10px 0;white-space:pre-wrap;color:#2B4F7A}
.proof .c{font-style:italic;color:#2E5E2B}
#carnetBtn{position:fixed;right:24px;bottom:24px;z-index:30;width:70px;height:70px;border-radius:50%;background:var(--paper);border:3px solid var(--ayla);box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 30px var(--ayla-dim);display:grid;place-items:center;transition:transform .2s}
#carnetBtn:hover{transform:scale(1.06) rotate(-4deg)}
#carnetBtn .dot{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
#carnet{position:fixed;inset:0;z-index:35;background:rgba(5,8,16,.6);display:grid;place-items:center;backdrop-filter:blur(5px)}
.book{width:min(1000px, calc(100% - 40px));height:min(680px, calc(100% - 40px));background:var(--paper);color:var(--paper-ink);border-radius:16px;display:grid;grid-template-columns:200px 1fr;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7);animation:open .45s ease-out;transform-style:preserve-3d}
@keyframes open{from{transform:rotateY(-25deg) scale(.96);opacity:0}to{transform:none;opacity:1}}
.book nav{background:var(--paper2);padding:20px 14px;border-right:2px dashed #D9B98A;display:flex;flex-direction:column;gap:6px}
.book nav button{background:transparent;border:0;text-align:left;padding:10px 12px;border-radius:8px;font:700 15px var(--body);color:var(--paper-ink)}
.book nav button.on{background:var(--ayla);color:#fff}
.book nav .foot{margin-top:auto;font-size:12px;color:#8B6A3E;font-style:italic}
.book main{padding:22px 26px;overflow:auto}
.book h3{font:800 20px var(--display);margin:0 0 4px}
.book .ql{font:800 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#9A5A12;margin-top:14px}
.book .ans{background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:10px 12px;margin-top:4px;min-height:40px;font-style:italic}
.book .close{position:absolute;right:26px;top:26px;background:transparent;border:0;color:#9A5A12;font:800 14px var(--display)}
.book table{border-collapse:collapse;width:100%;margin-top:10px;color:inherit;font-size:inherit}
.book td{padding:8px 6px;border-bottom:1px solid #E6D6B8;vertical-align:top}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid #C9B48F;color:#fff;font-size:13px}
.tick.on{background:var(--cit);border-color:var(--cit)}
.gp{height:12px;border-radius:6px;background:#EADFC8;overflow:hidden;margin-top:6px}
.gp i{display:block;height:100%}

/* ---------- title & map ---------- */
.title{position:fixed;inset:0;z-index:16;display:grid;place-items:center;text-align:center;padding:20px}
.title h1{font:800 clamp(40px,7vw,86px) var(--display);margin:0;letter-spacing:-.01em;line-height:1;text-shadow:0 0 40px var(--fl-glow)}
.title h1 span{display:block;font-size:.42em;font-weight:500;color:#CFE4FF;letter-spacing:.2em;text-transform:uppercase;margin-top:12px}
.title p{color:var(--muted);max-width:560px;margin:18px auto 26px;font-size:17px}
.title .note{font-size:13px;color:var(--muted);max-width:520px;margin:30px auto 0;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(20,31,54,.6)}
.map{position:fixed;inset:70px 0 0 0;z-index:14;perspective:1400px;display:grid;place-items:center}
.mapplane{position:relative;width:min(1100px,92vw);height:min(560px,70vh);transform:rotateX(38deg) translateY(-20px);transform-style:preserve-3d;
  background:linear-gradient(180deg, rgba(94,168,255,.05), rgba(94,168,255,.12));border:1px solid rgba(94,168,255,.35);border-radius:24px;
  box-shadow:0 60px 120px rgba(0,0,0,.6), 0 0 80px var(--fl-dim) inset}
.mapplane svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:var(--muted);font:800 20px var(--display);display:grid;place-items:center;
  transform:translateZ(30px);transform-style:preserve-3d;box-shadow:0 14px 30px rgba(0,0,0,.5);transition:transform .2s}
.node .lab{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--body);color:var(--muted);letter-spacing:.02em}
.node.active{border-color:var(--ayla);color:var(--ayla);background:#2A1F0F;box-shadow:0 0 0 6px var(--ayla-dim), 0 0 40px var(--ayla-dim), 0 14px 30px rgba(0,0,0,.5);cursor:pointer;animation:beacon 2s infinite}
.node.active .lab{color:var(--ayla)}
.node.active:hover{transform:translateZ(60px) scale(1.06)}
.node.done{border-color:var(--cit);color:var(--cit);background:#0F2A1B}
@keyframes beacon{0%,100%{box-shadow:0 0 0 6px var(--ayla-dim),0 14px 30px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 14px rgba(232,162,74,.08),0 0 50px var(--ayla-dim),0 14px 30px rgba(0,0,0,.5)}}
.maphud{position:fixed;left:24px;bottom:28px;z-index:15;width:min(520px,calc(100% - 140px));background:rgba(20,31,54,.9);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.maphud .t{font:800 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ayla)}
@media (max-width:1100px){#hudRight{display:none}.ph{width:76px}}
@media (max-width:760px){
  .cards{grid-template-columns:1fr}
  #dlg{width:calc(100% - 24px);bottom:100px}
  .bubble .txt{font-size:16px}
  .phases{display:none}
  .chars{bottom:30%;height:200px} .char{width:110px;height:190px}
  .gauges{grid-template-columns:1fr}
  .book{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .book nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px dashed #D9B98A}
  .book nav .foot{display:none}
  .mapplane{transform:rotateX(30deg)}
  .node .lab{display:none}
}

/* ---------- speech bubbles on characters ---------- */
#speech{position:fixed;inset:0;z-index:15;cursor:pointer}
.speech{position:fixed;background:#F7F9FF;color:#1B2538;border-radius:18px;padding:12px 16px 10px;box-shadow:0 18px 40px rgba(0,0,0,.45);animation:pop2 .28s cubic-bezier(.2,.9,.3,1.3);text-align:left;pointer-events:none;z-index:16}
.speech .tail{position:absolute;width:0;height:0;border:14px solid transparent}
.speech.above .tail{bottom:-14px;border-top-color:#F7F9FF;border-bottom:0;left:var(--tx,50%);transform:translateX(-50%)}
.speech.rightside .tail{left:-14px;top:var(--ty,30px);border-right-color:#F7F9FF;border-left:0}
.speech.leftside .tail{right:-14px;top:var(--ty,30px);border-left-color:#F7F9FF;border-right:0}
.speech .who{font:800 11px var(--display);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.speech .txt{font-size:16px;line-height:1.45}
.speech .hint{font-size:10px;color:#6B7A94;margin-top:8px;text-align:right;font-style:italic}
.speech .who.ayla{color:#B06A14} .speech .who.cit{color:#2E7A4A} .speech .who.saren{color:#5B3FA0} .speech .who.elio{color:#3E5B8C}
@keyframes pop2{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.flpanel{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(560px,calc(100% - 40px));background:linear-gradient(180deg, rgba(94,168,255,.22), rgba(16,26,48,.94));border:1px solid var(--fl);border-radius:6px;padding:14px 18px 10px;
  box-shadow:0 0 0 1px rgba(94,168,255,.25), 0 0 50px var(--fl-glow);animation:rise .3s ease-out}
.flpanel .who{font:700 12px var(--mono);color:var(--fl);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}

function buildings(seed, count, color, lit){
  let r = seed; const rnd=()=>{ r=(r*9301+49297)%233280; return r/233280; };
  let s = `<svg viewBox="0 0 1600 600" preserveAspectRatio="none">`;
  let x=0;
  for(let i=0;i<count && x<1600;i++){
    const w=40+rnd()*110, h=120+rnd()*440, y=600-h;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/>`;
    if(rnd()>.5) s += `<rect x="${x+w*.3}" y="${y-30-rnd()*60}" width="${w*.4}" height="${40+rnd()*60}" fill="${color}"/>`;
    for(let wy=y+14; wy<590; wy+=22){ for(let wx=x+8; wx<x+w-12; wx+=16){ if(rnd()>.45) s += `<rect x="${wx}" y="${wy}" width="8" height="11" fill="${lit}" opacity="${.35+rnd()*.65}"/>`; } }
    x += w + 6 + rnd()*30;
  }
  return s + `</svg>`;
}

const Music=(()=>{
  let ctx, master, filter, lfo, lfoGain, drone, droneG, voices=[], mood=null, timer=null, muted=false;
  try{ muted = localStorage.getItem("ayla_mute")==="1"; }catch(e){}
  const MOODS={
    dome:{chords:[[220,277.18,329.63],[196,246.94,293.66],[174.61,220,261.63],[196,246.94,293.66]], type:"triangle", cutoff:900, drone:55, tempo:9000, bright:.9},
    city:{chords:[[130.81,155.56,196],[123.47,146.83,185],[110,130.81,164.81],[116.54,138.59,174.61]], type:"sawtooth", cutoff:420, drone:41.2, tempo:11000, bright:.55},
    tense:{chords:[[110,130.81,155.56],[103.83,123.47,146.83],[98,116.54,146.83]], type:"sawtooth", cutoff:340, drone:36.7, tempo:7000, bright:.5},
    good:{chords:[[174.61,220,261.63],[196,246.94,293.66],[220,277.18,329.63],[261.63,329.63,392]], type:"triangle", cutoff:1300, drone:65.4, tempo:8000, bright:1},
    bad:{chords:[[110,130.81,164.81],[103.83,123.47,155.56]], type:"sawtooth", cutoff:280, drone:36.7, tempo:12000, bright:.4},
    paper:{chords:[[261.63,329.63,392],[246.94,293.66,369.99],[220,277.18,329.63]], type:"sine", cutoff:1600, drone:0, tempo:9000, bright:.8}
  };
  function init(){
    if(ctx) return true; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0.0001;
    const delay=ctx.createDelay(2); delay.delayTime.value=.46; const fb=ctx.createGain(); fb.gain.value=.4; const wet=ctx.createGain(); wet.gain.value=.4;
    master.connect(ctx.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
    filter=ctx.createBiquadFilter(); filter.type="lowpass"; filter.Q.value=.8; filter.frequency.value=500; filter.connect(master);
    lfo=ctx.createOscillator(); lfo.frequency.value=.06; lfoGain=ctx.createGain(); lfoGain.gain.value=160; lfo.connect(lfoGain); lfoGain.connect(filter.frequency); lfo.start();
    for(let v=0;v<3;v++){ const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(); g.gain.value=0; o.connect(g); o2.connect(g); g.connect(filter); o.start(); o2.start(); voices.push({o,o2,g}); }
    drone=ctx.createOscillator(); drone.type="sine"; droneG=ctx.createGain(); droneG.gain.value=0; drone.connect(droneG); droneG.connect(master); drone.start();
    return true;
  }
  function setChord(ch,m){ const t=ctx.currentTime; voices.forEach((v,i)=>{ const f=ch[i]; v.o.type=m.type; v.o2.type=m.type; v.o.frequency.setTargetAtTime(f,t,1.6); v.o2.frequency.setTargetAtTime(f*1.004,t,1.6); v.g.gain.setTargetAtTime(0.05*m.bright,t,2.2); }); }
  function set(name){
    mood=name; if(!ctx) return; const m=MOODS[name]; const t=ctx.currentTime;
    filter.frequency.setTargetAtTime(m.cutoff,t,2.5);
    if(m.drone){ drone.frequency.setTargetAtTime(m.drone,t,1); droneG.gain.setTargetAtTime(0.06,t,2.5); } else droneG.gain.setTargetAtTime(0,t,2);
    clearInterval(timer); let k=0; setChord(m.chords[0],m); timer=setInterval(()=>{ k=(k+1)%m.chords.length; setChord(m.chords[k],m); }, m.tempo);
  }
  function start(){ if(!init()) return; ctx.resume(); if(!muted) master.gain.setTargetAtTime(0.7,ctx.currentTime,3); if(mood) set(mood); ui(); }
  function toggle(){ muted=!muted; try{localStorage.setItem("ayla_mute",muted?"1":"0");}catch(e){} if(ctx){ ctx.resume(); master.gain.setTargetAtTime(muted?0.0001:0.7,ctx.currentTime,.6); } ui(); }
  function tick(){ if(!ctx||muted) return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=740; g.gain.value=0.0001; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime; g.gain.setTargetAtTime(0.04,t,.005); g.gain.setTargetAtTime(0.0001,t+.04,.03); o.start(t); o.stop(t+.2); }
  function ui(){ const b=document.getElementById("muteBtn"); if(!b) return; b.classList.toggle("on",!muted && !!ctx); b.textContent = muted ? "♪ Musique coupée" : "♪ Musique"; b.setAttribute("aria-pressed", muted?"false":"true"); }
  return {start,set,toggle,tick,ui,state:()=>ctx?ctx.state:"none",mood:()=>mood};
})();

const WHO2CHAR={"Ayla":"ayla","Kade":"kade","Technicien masqué":"elio","Saren":"saren","Amari":"kids","Rami":"kids","Mina":"kids"};
const speechLayer=document.getElementById("speech");
function runDialogue(lines, done){
  let i=0; const stage=document.getElementById("stage");
  speechLayer.classList.remove("hidden"); dlg.classList.add("hidden");
  const clear=()=>{ speechLayer.innerHTML=""; };
  const show=()=>{
    const L=lines[i];
    if(L.dome!==undefined) setDome(!!L.dome); else if(L.chars) setDome(false);
    if(L.chars) showChars(L.chars, L.speak); else if(L.dome) showChars(["kids","saren"], L.who==="Saren"?"saren":"kids");
    if(L.fx==="off") cityLights(false); if(L.fx==="on") cityLights(true);
    clear();
    const hint=`<div class="hint">${i<lines.length-1?"Toucher pour continuer":"Toucher pour poursuivre"} · ${i+1}/${lines.length}</div>`;
    const key=WHO2CHAR[L.who]; const charEl = key ? document.querySelector(`.char[data-k="${key}"]`) : null;
    if(L.fl){ speechLayer.innerHTML=`<div class="flpanel"><div class="who">FriendLoop</div><div class="txt">${L.text}</div>${hint}</div>`; }
    else if(L.echo){ speechLayer.innerHTML=`<div class="echo-bubble"><div class="who">Saren (écho)</div><div class="txt">${L.text}</div>${hint}</div>`; }
    else if(charEl){
      const b=document.createElement("div"); b.className="speech above";
      b.innerHTML=`<div class="who ${L.cls||""}">${L.who}</div><div class="txt">${L.text}</div>${hint}<div class="tail"></div>`;
      const r=charEl.getBoundingClientRect(); const headX=r.left+r.width/2, headY=r.top+r.height*0.10;
      const bw=Math.min(380, innerWidth-24); b.style.width=bw+"px"; speechLayer.appendChild(b);
      const bh=b.offsetHeight; let mode="above", top=headY-bh-18, left=headX-bw/2;
      if(top<80){
        const spaceR=innerWidth-r.right, spaceL=r.left;
        if(Math.max(spaceR,spaceL) > bw*0.75){ mode = spaceR>=spaceL ? "rightside" : "leftside"; }
        top=Math.max(80, Math.min(innerHeight-bh-20, r.top+r.height*0.18));
        if(mode==="rightside") left=r.right-16; else if(mode==="leftside") left=r.left-bw+16; else top=80;
        if(mode!=="above"){ const w2=Math.min(bw, mode==="rightside"? innerWidth-left-12 : left+bw-12); b.style.width=Math.max(200,w2)+"px"; }
      }
      left=Math.max(12, Math.min(innerWidth-parseFloat(b.style.width)-12, left));
      b.className="speech "+mode; b.style.left=left+"px"; b.style.top=top+"px";
      b.style.setProperty("--tx", (headX-left)+"px"); b.style.setProperty("--ty", Math.max(16, r.top+r.height*0.28-top)+"px");
    } else { speechLayer.innerHTML=`<div class="caption"><div class="txt">${L.text}</div>${hint}</div>`; }
  };
  const next=()=>{ Music.tick(); i++; if(i<lines.length) show(); else { clear(); speechLayer.classList.add("hidden"); stage.onclick=null; speechLayer.onclick=null; document.onkeydown=null; done(); } };
  stage.onclick=next; speechLayer.onclick=next;
  document.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); next(); } };
  show();
}

/* ============================== CARNET ============================== */
const carnet=document.getElementById("carnet");
document.getElementById("carnetBtn").onclick=()=>{ document.getElementById("carnetDot").classList.add("hidden"); openCarnet("missions"); };
function openCarnet(tab){
  const m=S.m1; const k=m.choice;
  const tabs=[["missions","Missions"],["preuves","Preuves"],["principes","Principes"],["jauges","Jauges"]];
  let body="";
  if(tab==="missions"){
    body = `<h3>Mission 1 · ${M1.principe}</h3><div class="small" style="color:#8B6A3E">${M1.quartier} · ${k?"Choix : option "+k:"En cours"}</div>`
      + M1.questions.map((q,i)=>`<div class="ql">${["Qui est concerné ?","Quelles conséquences ?","Quelles valeurs en tension ?","Quelle autre voie ?"][i]}</div><div class="ans">${m.answers[i]||"<span style='opacity:.5'>Pas encore répondu.</span>"}</div>`).join("")
      + `<div class="ql">Parce que...</div><div class="ans">${m.why||"<span style='opacity:.5'>Pas encore choisi.</span>"}</div>`
      + (m.note?`<div class="ql">Note</div><div class="ans">${m.note}</div>`:"");
  } else if(tab==="preuves"){
    body = m.done||k ? `<h3>Preuve 1 · ${M1.preuve.titre}</h3><pre style="font-family:var(--mono);background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:12px;white-space:pre-wrap;color:#2B4F7A">${M1.preuve.doc}</pre>${k==="B"?`<div style="font-style:italic;color:#2E5E2B">${M1.preuve.commentB}</div>`:`<div class="small" style="color:#8B6A3E">${M1.preuve.maskedA}</div>`}` : `<h3>Preuves</h3><p>Aucune preuve pour l'instant. Chaque mission en apporte une.</p>`;
  } else if(tab==="principes"){
    body = `<h3>Les dix principes de la Recommandation</h3><table>${PRINCIPES.map((p,i)=>`<tr><td style="width:34px"><span class="tick ${i===0&&m.done?"on":""}">${i===0&&m.done?"✓":""}</span></td><td>${i+1}. ${p}</td><td class="small" style="color:#8B6A3E;text-align:right">${QUARTIERS[i]}</td></tr>`).join("")}</table>`;
  } else {
    body = `<h3>Jauges</h3><div class="ql" style="color:#2F6FC4">Confiance de FriendLoop · ${S.fl}</div><div class="gp"><i style="width:${S.fl}%;background:#5EA8FF"></i></div>
      <div class="ql" style="color:#2E5E2B">Confiance des citoyens · ${S.cit}</div><div class="gp"><i style="width:${S.cit}%;background:#3E7D3A"></i></div>
      <p class="small" style="color:#8B6A3E;margin-top:16px">Les deux jauges modifient les dialogues et la fin. Aucune ne fait perdre.</p>`;
  }
  carnet.classList.remove("hidden");
  carnet.innerHTML = `<div class="book" role="dialog" aria-label="Carnet d'Ayla"><nav>${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}<div class="foot">Le carnet d'Ayla. Papier, encre, mains humaines.</div></nav><main>${body}</main><button class="close" id="cl">Fermer ✕</button></div>`;
  carnet.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openCarnet(b.dataset.t));
  carnet.querySelector("#cl").onclick=()=>carnet.classList.add("hidden");
  carnet.onclick=e=>{ if(e.target===carnet) carnet.classList.add("hidden"); };
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") carnet.classList.add("hidden"); });

screenTitle();
</script>

</body>
</html>
