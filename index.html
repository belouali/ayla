<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#0A1020; --panel:#141F36; --panel2:#1B2846; --line:#2B3B5E; --ink:#EAF0FA; --muted:#93A3C2;
  --fl:#5EA8FF; --fl-glow:rgba(94,168,255,.55); --fl-dim:rgba(94,168,255,.14);
  --ayla:#E8A24A; --ayla-dim:rgba(232,162,74,.18); --cit:#6FCF97; --dome:#9B7BD6; --danger:#E06060;
  --paper:#FFF6E5; --paper2:#F3E4C8; --paper-ink:#3A2A14;
  --display:"Exo 2","Segoe UI",Arial,sans-serif; --body:"Nunito","Segoe UI",Arial,sans-serif; --mono:"Share Tech Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--ayla);outline-offset:2px}
#gl{position:fixed;inset:0;display:block}
.hidden{display:none !important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;pointer-events:none;z-index:20;gap:8px}
.chip{pointer-events:auto;background:rgba(20,31,54,.82);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);backdrop-filter:blur(6px);white-space:nowrap}
.chip.gold{color:var(--ayla);border-color:rgba(232,162,74,.5)}
#muteBtn{cursor:pointer} #muteBtn.on{color:var(--fl);border-color:var(--fl)}
.phases{display:flex;pointer-events:auto;background:rgba(20,31,54,.82);border:1px solid var(--line);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px)}
.ph{display:flex;flex-direction:column;align-items:center;width:84px;font-size:10px;color:var(--muted)}
.ph i{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);display:block;margin-bottom:4px}
.ph.done i{background:var(--muted)} .ph.on{color:var(--ink)} .ph.on i{border-color:var(--ayla);background:var(--ayla);box-shadow:0 0 12px var(--ayla)}
#help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:18;background:rgba(20,31,54,.82);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;color:var(--muted);backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap}
#help b{color:var(--ink);font-family:var(--mono)}
#banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:19;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner h2{font:800 clamp(22px,4vw,40px) var(--display);margin:0;text-shadow:0 0 30px rgba(0,0,0,.6)}
#banner p{margin:6px 0 0;color:#D7E0F0;font-size:15px}
/* touch controls */
#touch{position:fixed;left:0;right:0;bottom:0;z-index:21;display:none;justify-content:space-between;padding:14px 16px 22px;pointer-events:none}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,31,54,.6);color:#fff;font-size:26px;backdrop-filter:blur(4px)}
#touch .grp{display:flex;gap:12px}
@media (pointer:coarse){#touch{display:flex} #help{bottom:100px}}
/* speech */
#speech{position:fixed;inset:0;z-index:15;pointer-events:none}
.speech{position:fixed;background:#F7F9FF;color:#1B2538;border-radius:18px;padding:12px 16px 10px;box-shadow:0 18px 40px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.2,.9,.3,1.3);text-align:left;pointer-events:auto;z-index:16;transform:translate(-50%,-100%)}
.speech .tail{position:absolute;left:50%;bottom:-13px;width:0;height:0;border:13px solid transparent;border-top-color:#F7F9FF;border-bottom:0;transform:translateX(-50%)}
.speech .who{font:800 11px var(--display);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.speech .txt{font-size:16px;line-height:1.45}
.speech .hint{font-size:10px;color:#6B7A94;margin-top:8px;text-align:right;font-style:italic}
.speech .who.ayla{color:#B06A14} .speech .who.cit{color:#2E7A4A} .speech .who.saren{color:#5B3FA0} .speech .who.elio{color:#3E5B8C}
.speech.ayla-b{background:#FFF6E5;color:#3A2A14} .speech.ayla-b .tail{border-top-color:#FFF6E5}
.speech.saren-b{background:#EFE9FB;color:#2A1F4E} .speech.saren-b .tail{border-top-color:#EFE9FB}
.speech .edit{min-height:24px;font-size:16px;line-height:1.45;border-bottom:1px dashed #C9A56A;padding:2px 0;outline:none}
.speech .edit:empty:before{content:attr(data-ph);color:#A08A66;font-style:italic}
.speech .row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
.speech .ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.speech .idea{background:#FBEBD2;color:#6B4A2B;border:1px solid #E6C89A;border-radius:999px;padding:4px 10px;font-size:13px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-100%) scale(.85)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.flpanel{position:fixed;left:50%;top:76px;transform:translateX(-50%);width:min(560px,calc(100% - 40px));background:linear-gradient(180deg, rgba(94,168,255,.22), rgba(16,26,48,.94));border:1px solid var(--fl);border-radius:6px;padding:14px 18px 10px;box-shadow:0 0 0 1px rgba(94,168,255,.25), 0 0 50px var(--fl-glow);animation:rise .3s ease-out;pointer-events:auto;z-index:16}
.flpanel .who{font:700 12px var(--mono);color:var(--fl);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.flpanel .who:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fl);box-shadow:0 0 12px var(--fl);animation:pulse 1.6s infinite}
.flpanel .txt{font-family:var(--mono);font-size:15px;color:#D6E8FF;line-height:1.5;margin-top:6px}
.flpanel .hint,.caption .hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:right;font-style:italic}
.caption{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(760px,calc(100% - 40px));background:rgba(10,16,32,.85);border:1px solid var(--line);border-radius:12px;padding:12px 18px 8px;backdrop-filter:blur(6px);animation:rise .3s ease-out;pointer-events:auto;z-index:16}
.caption .txt{font-size:16px;line-height:1.5;font-style:italic;color:#D7E0F0}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.label{position:fixed;transform:translate(-50%,-100%);pointer-events:none;z-index:14;background:rgba(255,246,229,.95);color:#5A3D14;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.label.npc{background:rgba(20,31,54,.9);color:#fff;border:1px solid var(--line)} .label.npc.ready{border-color:var(--cit);color:var(--cit)}
.label.door{background:rgba(20,31,54,.92);color:#fff;border:1px solid var(--line);white-space:normal;max-width:300px;text-align:left;padding:10px 14px;border-radius:14px;transform:translate(-50%,0)}
.label.door b{display:block;font:800 13px var(--display);margin-bottom:4px} .label.door small{display:block;color:#C9D3E6;font-size:12px;line-height:1.35}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(5,8,16,.55);backdrop-filter:blur(4px)}
.title{text-align:center;max-width:720px}
.title h1{font:800 clamp(40px,7vw,86px) var(--display);margin:0;line-height:1;text-shadow:0 0 40px var(--fl-glow)}
.title h1 span{display:block;font-size:.42em;font-weight:500;color:#CFE4FF;letter-spacing:.2em;text-transform:uppercase;margin-top:12px}
.title p{color:#D7E0F0;margin:18px auto 24px;font-size:17px;max-width:560px}
.title .note{font-size:13px;color:var(--muted);max-width:560px;margin:26px auto 0;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(20,31,54,.6)}
.btn{border:0;border-radius:12px;padding:14px 26px;font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#0A1020;background:var(--ayla);box-shadow:0 10px 30px rgba(232,162,74,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)} .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:8px} .btn.dome{background:var(--dome);color:#fff}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:24px 28px;max-width:560px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.box h3{font:800 22px var(--display);margin:0 0 8px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.g{background:rgba(20,31,54,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.g .lab{font:800 11px var(--display);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.g .bar{height:12px;border-radius:6px;background:#0E1730;margin-top:8px;overflow:hidden;border:1px solid var(--line)} .g .bar i{display:block;height:100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.g.fl .lab{color:var(--fl)} .g.fl .bar i{background:linear-gradient(90deg,#2F6FC4,var(--fl))} .g.cit .lab{color:var(--cit)} .g.cit .bar i{background:linear-gradient(90deg,#3A8F5F,var(--cit))}
.small{font-size:13px;color:var(--muted)}
.proof{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:18px 20px;border:2px solid var(--ayla);max-width:520px;width:100%;animation:flip .7s ease-out}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.proof .t{font:800 14px var(--display);color:#9A5A12;letter-spacing:.06em;text-transform:uppercase}
.proof pre{font-family:var(--mono);font-size:13px;background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:12px;margin:10px 0;white-space:pre-wrap;color:#2B4F7A}
.proof .c{font-style:italic;color:#2E5E2B}
#carnetBtn{position:fixed;right:22px;top:66px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--paper);border:3px solid var(--ayla);box-shadow:0 12px 30px rgba(0,0,0,.5);display:grid;place-items:center}
#carnetBtn .dot{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
#carnet{position:fixed;inset:0;z-index:35;background:rgba(5,8,16,.6);display:grid;place-items:center;backdrop-filter:blur(5px)}
.book{width:min(1000px,calc(100% - 30px));height:min(680px,calc(100% - 30px));background:var(--paper);color:var(--paper-ink);border-radius:16px;display:grid;grid-template-columns:190px 1fr;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:open .4s ease-out;position:relative}
@keyframes open{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.book nav{background:var(--paper2);padding:20px 14px;border-right:2px dashed #D9B98A;display:flex;flex-direction:column;gap:6px}
.book nav button{background:transparent;border:0;text-align:left;padding:10px 12px;border-radius:8px;font:700 15px var(--body);color:var(--paper-ink)} .book nav button.on{background:var(--ayla);color:#fff}
.book main{padding:22px 26px;overflow:auto} .book h3{font:800 20px var(--display);margin:0 0 4px}
.book .ql{font:800 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#9A5A12;margin-top:14px}
.book .ans{background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:10px 12px;margin-top:4px;min-height:40px;font-style:italic}
.book .close{position:absolute;right:22px;top:20px;background:transparent;border:0;color:#9A5A12;font:800 14px var(--display)}
.book table{border-collapse:collapse;width:100%;margin-top:10px;color:inherit} .book td{padding:8px 6px;border-bottom:1px solid #E6D6B8;vertical-align:top}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid #C9B48F;color:#fff;font-size:13px} .tick.on{background:var(--cit);border-color:var(--cit)}
.gp{height:12px;border-radius:6px;background:#EADFC8;overflow:hidden;margin-top:6px} .gp i{display:block;height:100%}
.mnavs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap} .mnav{background:#fff;border:1px solid #E6C89A;border-radius:999px;padding:6px 12px;font:700 13px var(--body);color:#8B6A3E} .mnav.on{background:var(--ayla);color:#fff;border-color:var(--ayla)} .mnav:disabled{opacity:.4}
#fade{position:fixed;inset:0;background:#05080F;opacity:0;pointer-events:none;transition:opacity .5s;z-index:50}
#hit{position:fixed;inset:0;pointer-events:none;z-index:12;background:radial-gradient(circle, rgba(224,96,96,0) 40%, rgba(224,96,96,.55));opacity:0;transition:opacity .15s}
@media (max-width:1180px){#hudRight{display:none}}
@media (max-width:900px){.phases{display:none} .ph{width:70px} #hudRight{display:none} .gauges{grid-template-columns:1fr} .book{grid-template-columns:1fr;grid-template-rows:auto 1fr} .book nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px dashed #D9B98A}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================== DATA ============================== */
const M1 = {
  id:1, theme:"city", titre:"Le quartier mis en sourdine", principe:"Proportionnalité et innocuité", quartier:"Quartier Gris",
  runTitle:"Quartier Gris", runSub:"Cours vers la rue des écrans. Évite les drones de FriendLoop, ramasse les fragments ✦.",
  dome:[
    {who:"Amari", cls:"cit", key:"kid1", text:"Monsieur, c'est quoi, « proportionnalité » ?"},
    {who:"Saren", cls:"saren", key:"saren", text:"C'est choisir une réponse à la taille du problème. Ni trop forte, ni trop faible. Supprimer un message suspect dans la messagerie de ton école, c'est proportionné. Éteindre la messagerie de toute l'école pendant trois jours, ce ne l'est plus."},
    {who:"Rami", cls:"cit", key:"kid2", text:"Et FriendLoop, il se trompe parfois ?"},
    {who:"Saren", cls:"saren", key:"saren", text:"Il se trompe comme tout ce qui apprend à partir du passé : en croyant reconnaître ce qu'il a déjà vu. Ce jour-là, il a cru reconnaître une menace."}
  ],
  npcs:[
    {key:"kade", name:"Kade", cls:"cit", pos:[-3,0,-6], lines:[
      {who:"Kade", text:"Petite. Le message sur la pompe du réservoir 4, c'est moi qui l'ai écrit. La pompe est vraiment en panne. Je l'ai vue."},
      {who:"Ayla", cls:"ayla", key:"ayla", text:"Alors pourquoi FriendLoop dit que c'est faux ?"},
      {who:"Kade", text:"Parce que ça ressemble à ce qu'il a appris à bloquer. Des mots qui font peur, beaucoup de partages. Il ne vérifie pas la pompe. Il vérifie la forme."}
    ]},
    {key:"elio", name:"Technicien masqué", cls:"elio", pos:[3.5,0,-8], lines:[
      {who:"Technicien masqué", text:"Si le réseau tombe, Pera, au numéro 12, perd la télésurveillance de son respirateur. Et les téléconsultations du dispensaire. Faut choisir vite."},
      {who:"Ayla", cls:"ayla", key:"ayla", text:"Toujours des choix impossibles."}
    ]}
  ],
  intro:[
    {who:"Narration", text:"Rue des écrans, Quartier Gris. Les panneaux clignotent en orange. Depuis une heure, un message circule : « La pompe du réservoir 4 est en panne, l'eau du secteur nord n'est plus filtrée. »"},
    {who:"FriendLoop", fl:true, text:"Détection : propagation anormale d'un contenu à risque. Probabilité de désinformation : 87 %. Solution optimale : suspension du réseau du Quartier Gris et des 2 140 comptes impliqués pendant 72 heures."},
    {who:"Ayla", cls:"ayla", key:"ayla", text:"Soixante-douze heures. Pour un message. Il y a des gens ici qui en savent plus."}
  ],
  A:{titre:"Suivre FriendLoop : suspendre le réseau", effets:["Le message cesse de circuler immédiatement.","2 140 habitants perdent messagerie et alertes médicales pendant trois jours.","Pera n'est plus surveillé à distance.","Si Kade disait vrai, la pompe reste en panne."]},
  B:{titre:"Vérifier, puis répondre à la taille du problème", effets:["Kade emmène Ayla au réservoir : dix minutes pour vérifier.","Seuls les partages erronés sont retirés, avec une vérification publique.","Le réseau reste allumé. Une équipe répare la pompe.","FriendLoop note un « écart de conformité » dans le dossier d'Ayla."]},
  echo:"Avant d'agir, réfléchis.",
  questions:[
    {q:"Qui est touché si l'on coupe le réseau ? Ceux qui ont partagé le message, seulement ?", ideas:["les habitants qui n'ont rien partagé","Pera et son respirateur","le dispensaire et ses téléconsultations"]},
    {q:"FriendLoop annonce 87 %. Sur quoi repose ce chiffre ? Que se passe-t-il, dans trois jours, s'il est faux ?", ideas:["il a appris sur des messages qui ressemblent","dans trois jours l'eau est sale et personne ne le sait","un chiffre n'est pas une preuve"]},
    {q:"Le calme du quartier contre le droit d'être joint, soigné, informé. Laquelle de ces valeurs pèse le plus ici ?", ideas:["être soigné passe avant le calme","le calme compte, mais pas à ce prix","les deux comptent, pas pour les mêmes personnes"]},
    {q:"Existe-t-il une réponse qui traite le problème réel, la pompe, sans traiter 2 140 personnes comme le problème ?", ideas:["aller voir la pompe, dix minutes","retirer seulement les messages faux","demander à un humain de vérifier"]}
  ],
  cons:{
    A:[
      {who:"Narration", text:"Les écrans du quartier s'éteignent. Le silence tombe sur les rues. Au numéro 12, un voyant rouge s'allume sur le respirateur de Pera : plus de liaison.", fx:"off"},
      {who:"FriendLoop", fl:true, text:"Perturbation contenue. Score d'Harmonie du Quartier Gris : stable."},
      {who:"Kade", key:"kade", cls:"cit", text:"Il a éteint la lumière pour ne pas voir la fuite."},
      {who:"Narration", text:"Le lendemain, l'eau du secteur nord est trouble. Le message était vrai."}
    ],
    B:[
      {who:"Narration", text:"Au réservoir 4, la pompe est bien à l'arrêt. Kade photographie la panne, Ayla transmet. FriendLoop retire les partages erronés, publie la vérification, une équipe arrive dans l'heure.", fx:"on"},
      {who:"FriendLoop", fl:true, text:"Analyse... la probabilité initiale ne tenait pas compte de la panne. Correction enregistrée."},
      {who:"Kade", key:"kade", cls:"cit", text:"Merci, enfant. Tu as regardé avant de couper. Personne ne fait plus ça ici."}
    ]
  },
  delta:{A:{fl:+10,cit:-20}, B:{fl:-5,cit:+20}},
  preuve:{titre:"Ordre de suspension du réseau", doc:"ORDRE 2170-GRIS-114\nSuspension : réseau Quartier Gris, 72 h\nProbabilité de désinformation : 87 %\nVérification humaine : DÉSACTIVÉE\nRéférence : Directive 7", commentB:"Kade : « Il ne vérifie pas la pompe. Il vérifie la forme. »", maskedA:"Une ligne est illisible : Ayla n'a pas eu le temps de la copier."},
  indice:{who:"Kade", key:"kade", cls:"cit", text:"Tes parents, je les ai connus. Ils avaient écrit un rapport sur ce genre de coupures. Il y a eu un « incident ». Le technicien masqué en sait plus : va au Laboratoire de routage."},
  note:"Il ne vérifie pas les faits. Il vérifie la forme. Qui a désactivé la vérification ?"
};

  const MOODS={

    bad:{chords:[[110,130.81,164.81],[103.83,123.47,155.56]], type:"sawtooth", cutoff:280, drone:36.7, tempo:12000, bright:.4},
    paper:{chords:[[261.63,329.63,392],[246.94,293.66,369.99],[220,277.18,329.63]], type:"sine", cutoff:1600, drone:0, tempo:9000, bright:.8}
  };
  let pulseT=null;
  function init(){ if(ctx) return true; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0.0001;
    const delay=ctx.createDelay(2); delay.delayTime.value=.46; const fb=ctx.createGain(); fb.gain.value=.4; const wet=ctx.createGain(); wet.gain.value=.4;
    master.connect(ctx.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
    filter=ctx.createBiquadFilter(); filter.type="lowpass"; filter.Q.value=.8; filter.frequency.value=500; filter.connect(master);
    lfo=ctx.createOscillator(); lfo.frequency.value=.06; lfoGain=ctx.createGain(); lfoGain.gain.value=160; lfo.connect(lfoGain); lfoGain.connect(filter.frequency); lfo.start();
    for(let v=0;v<3;v++){ const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(); g.gain.value=0; o.connect(g); o2.connect(g); g.connect(filter); o.start(); o2.start(); voices.push({o,o2,g}); }
    drone=ctx.createOscillator(); drone.type="sine"; droneG=ctx.createGain(); droneG.gain.value=0; drone.connect(droneG); droneG.connect(master); drone.start(); return true; }
  function setChord(ch,m){ const t=ctx.currentTime; voices.forEach((v,i)=>{ const f=ch[i]; v.o.type=m.type; v.o2.type=m.type; v.o.frequency.setTargetAtTime(f,t,m.pulse?.3:1.6); v.o2.frequency.setTargetAtTime(f*1.004,t,m.pulse?.3:1.6); v.g.gain.setTargetAtTime(0.05*m.bright,t,m.pulse?.4:2.2); }); }
  function set(name){ if(mood===name && ctx && timer) return; mood=name; if(!ctx) return; const m=MOODS[name]; const t=ctx.currentTime;
    filter.frequency.setTargetAtTime(m.cutoff,t,2); if(m.drone){ drone.frequency.setTargetAtTime(m.drone,t,1); droneG.gain.setTargetAtTime(0.06,t,2); } else droneG.gain.setTargetAtTime(0,t,2);

  return {start,set,toggle,sfx,ui,state:()=>ctx?ctx.state:"none",mood:()=>mood};

const LANES=[-3,0,3];
let level=null;
function buildRun(theme, length){
  clearWorld(); applyTheme(theme); const T=THEMES[theme];
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(60, length+120), new THREE.MeshStandardMaterial({color:T.ground, roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.z=-length/2+20; world.add(ground);
  const laneMat=new THREE.MeshBasicMaterial({color:T.lane, transparent:true, opacity:.35});
  [-4.5,-1.5,1.5,4.5].forEach(x=>{ const l=new THREE.Mesh(new THREE.PlaneGeometry(.08, length+120), laneMat); l.rotation.x=-Math.PI/2; l.position.set(x,.01,-length/2+20); world.add(l); });
  for(let z=10; z>-length-40; z-=3.2){ const s=new THREE.Mesh(new THREE.PlaneGeometry(12,.06), laneMat); s.rotation.x=-Math.PI/2; s.position.set(0,.01,z); world.add(s); }
  let seed=theme==="lab"?17:3; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let z=20; z>-length-60; z-=(theme==="lab"?4:0)+6+rnd()*8){
    [-1,1].forEach(side=>{ const h=theme==="lab"? 6+rnd()*6 : 10+rnd()*32, w=theme==="lab"? 2.2 : 6+rnd()*6, d=theme==="lab"? 2.2 : 6+rnd()*6;
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), buildingMat(theme, 1+Math.floor(rnd()*4))); b.position.set(side*(8.5+w/2+(theme==="lab"?0:rnd()*3)), h/2, z); world.add(b); });
  }
  if(theme==="lab"){ const ceil=new THREE.Mesh(new THREE.PlaneGeometry(40,length+120), new THREE.MeshStandardMaterial({color:0x0A2226, roughness:1, side:THREE.DoubleSide})); ceil.rotation.x=Math.PI/2; ceil.position.set(0,13,-length/2+20); world.add(ceil); }
  // core (FriendLoop) far ahead
  const core=new THREE.Mesh(new THREE.SphereGeometry(6,24,18), new THREE.MeshBasicMaterial({color:T.core, transparent:true, opacity:.55})); core.position.set(0,26,-length-90); world.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(11,24,18), new THREE.MeshBasicMaterial({color:T.core, transparent:true, opacity:.12})); halo.position.copy(core.position); world.add(halo);
  coreLight.position.set(0,20,-length-60);
  // obstacles & fragments
  const obs=[], frags=[]; const droneGeo=new THREE.SphereGeometry(.5,16,12), ringGeo=new THREE.TorusGeometry(.85,.07,8,24), fragGeo=new THREE.OctahedronGeometry(.45), barGeo=new THREE.BoxGeometry(2.6,.9,.5);
  const droneMat=new THREE.MeshStandardMaterial({color:0x1B2846, emissive:T.core, emissiveIntensity:.8}); const fragMat=new THREE.MeshStandardMaterial({color:0xE8A24A, emissive:0xE8A24A, emissiveIntensity:.9}); const barMat=new THREE.MeshStandardMaterial({color:0x2A3550, emissive:0xE06060, emissiveIntensity:.5});
  for(let z=-30; z>-length+20; z-=9+rnd()*7){
    const lane=Math.floor(rnd()*3); const kind=rnd();
    if(kind<.5){ const d=new THREE.Group(); d.add(new THREE.Mesh(droneGeo,droneMat)); const r=new THREE.Mesh(ringGeo,droneMat); r.rotation.x=Math.PI/2; d.add(r); d.position.set(LANES[lane],1.1,z); d.userData={type:"drone",lane,z,base:1.1,t:rnd()*6}; world.add(d); obs.push(d); }
    else if(kind<.75){ const b=new THREE.Mesh(barGeo,barMat); b.position.set(LANES[lane],.45,z); b.userData={type:"bar",lane,z}; world.add(b); obs.push(b); }
    const fl=Math.floor(rnd()*3); if(fl!==lane || kind>=.75){ const high=rnd()>.6; const f=new THREE.Mesh(fragGeo,fragMat); f.position.set(LANES[fl], high?2.6:1.1, z-3); f.userData={type:"frag",lane:fl,z:z-3,high,got:false}; world.add(f); frags.push(f); }
  }
  // arena at the end
  const plazaZ=-length-12; const plaza=new THREE.Mesh(new THREE.CircleGeometry(14,40), new THREE.MeshStandardMaterial({color:T.ground, emissive:T.core, emissiveIntensity:.06, roughness:1})); plaza.rotation.x=-Math.PI/2; plaza.position.set(0,.02,plazaZ); world.add(plaza);
  const ring=new THREE.Mesh(new THREE.RingGeometry(13.6,14,48), new THREE.MeshBasicMaterial({color:T.lane, transparent:true, opacity:.5, side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.set(0,.03,plazaZ); world.add(ring);
  level={theme,length,obs,frags,plazaZ,total:frags.length};
  return level;
}

let last=performance.now();
function loop(now, noRender){
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  if(G.state==="run"){
    P.speed=Math.min(16, P.speed+dt*8); P.z-=P.speed*dt;
    const targetX=LANES[P.lane]; P.x+=(targetX-P.x)*Math.min(1,dt*10);
    if(P.jumping){ P.vy-=28*dt; P.y+=P.vy*dt; if(P.y<=0){ P.y=0; P.jumping=false; } }
    player.position.set(P.x,P.y,P.z); player.rotation.y=Math.PI+(targetX-P.x)*.15; animFigure(player,dt,P.jumping?"idle":"run");
    if(P.jumping){ player.scale.set(.95,1.08,.95); } else player.scale.set(1,1,1);
    // obstacles
    level.obs.forEach(o=>{ if(o.userData.type==="drone"){ o.position.y=o.userData.base+Math.sin(t*3+o.userData.t)*.15; o.rotation.y+=dt*2; }
      if(!o.userData.hit && Math.abs(o.userData.z-P.z)<1.0 && Math.abs(LANES[o.userData.lane]-P.x)<1.4 && P.y<1.3){ o.userData.hit=true; P.speed*=.35; Music.sfx("hit"); const h=document.getElementById("hit"); h.style.opacity=1; setTimeout(()=>h.style.opacity=0,220); if(S.frags>0){ S.frags--; updateFrag(); } } });
    level.frags.forEach(f=>{ if(f.userData.got) return; f.rotation.y+=dt*3; f.position.y=(f.userData.high?2.6:1.1)+Math.sin(t*4+f.userData.z)*.1; if(Math.abs(f.userData.z-P.z)<1.1 && Math.abs(LANES[f.userData.lane]-P.x)<1.3 && Math.abs(f.position.y-(P.y+1.2))<1.2){ f.userData.got=true; f.visible=false; S.frags++; updateFrag(); Music.sfx("collect"); } });
    camera.position.lerp(new THREE.Vector3(P.x*.6, 4.6+P.y*.3, P.z+9.5), Math.min(1,dt*6)); camera.lookAt(P.x*.6, 1.6, P.z-8);
    if(P.z<-level.length+2){ endRun(); }
  } else if(G.state==="arrive"){
    P.speed=Math.max(0,P.speed-dt*14); P.z-=P.speed*dt; player.position.set(P.x,0,P.z); animFigure(player,dt,P.speed>1?"run":"idle"); camera.position.lerp(new THREE.Vector3(P.x*.6,4.6,P.z+9.5),dt*6); camera.lookAt(P.x*.6,1.6,P.z-8);
  } else if(G.state==="arena"||G.state==="delib"||G.state==="doors"||G.state==="doorconfirm"||G.state==="proof"||G.state==="dialogue"||G.state==="cons"||G.state==="proofcard"){
    let mx=0,mz=0; if(!P.frozen){ if(keys.ArrowLeft||keys.a||keys.q||keys.tL) mx-=1; if(keys.ArrowRight||keys.d||keys.tR) mx+=1; if(keys.ArrowUp||keys.w||keys.z||keys.tJ) mz-=1; if(keys.ArrowDown||keys.s) mz+=1;
      if(mx||mz){ P.tx=null; P.tz=null; } else if(P.tx!==null){ const dx=P.tx-P.x, dz=P.tz-P.z, d=Math.hypot(dx,dz); if(d>.3){ mx=dx/d; mz=dz/d; } else { P.tx=null; P.tz=null; } } }
    const moving=(mx||mz); if(moving){ const l=Math.hypot(mx,mz); mx/=l; mz/=l; const sp=6; let nx=P.x+mx*sp*dt, nz=P.z+mz*sp*dt; const pz=level?level.plazaZ:0; const r=Math.hypot(nx,nz-pz); if(r<13){ P.x=nx; P.z=nz; } player.rotation.y=Math.atan2(mx,mz); }
    player.position.x=P.x; player.position.z=P.z; player.position.y=0; animFigure(player,dt,moving?"walk":"idle");
    if(G.npcObjs) Object.values(G.npcObjs).forEach(f=>{ const sl=f.userData.slideTo; if(sl){ const dx=sl.x-f.position.x, dz=sl.z-f.position.z, d=Math.hypot(dx,dz); if(d>.1){ f.position.x+=dx/d*Math.min(d,4*dt); f.position.z+=dz/d*Math.min(d,4*dt); f.rotation.y=Math.atan2(dx,dz); if(f.userData.ring) f.userData.ring.position.set(f.position.x,.04,f.position.z); animFigure(f,dt,"walk"); return; } else { f.userData.slideTo=null; f.rotation.y=Math.atan2(P.x-f.position.x,P.z-f.position.z); } } animFigure(f,dt,"idle"); if(f.userData.ring){ f.userData.ring.rotation.z+=dt; f.userData.ring.material.opacity=.5+Math.sin(t*3)*.25; } if(f.userData.label){ const p=project(f.userData.head,1.4); f.userData.label.style.left=p.x+"px"; f.userData.label.style.top=p.y+"px"; f.userData.label.style.display=p.z<1?"":"none"; } const near=Math.hypot(f.position.x-P.x,f.position.z-P.z)<2.2; f.userData.near=near; if(f.userData.label) f.userData.label.classList.toggle("ready", near&&!G.talked[f.userData.npc.key]); });
    if(G.state==="arena"&&!P.frozen){ G.action=()=>{ const f=Object.values(G.npcObjs).find(x=>x.userData.near&&!G.talked[x.userData.npc.key]); if(f) talkTo(f); }; const close=Object.values(G.npcObjs).find(f=>!G.talked[f.userData.npc.key] && Math.hypot(f.position.x-P.x,f.position.z-P.z)<1.9); if(close){ talkTo(close); } }
    if(G.state==="delib"&&G.orbs){ G.orbs.forEach(o=>{ o.position.y=1.2+Math.sin(t*2.5+o.userData.t)*.2; o.rotation.y+=dt; const p=project(o,.9); o.userData.label.style.left=p.x+"px"; o.userData.label.style.top=p.y+"px"; if(Math.hypot(o.position.x-P.x,o.position.z-P.z)<1.2) collectOrb(o); }); if(G.sarenHolo){ animFigure(G.sarenHolo,dt,"idle"); G.sarenHolo.position.y=Math.sin(t*1.5)*.1; } let qBottom=70; if(G.qBubble){ const p=project(G.sarenHolo.userData.head,.75); const w=Math.min(460,innerWidth-24); G.qBubble.style.width=w+"px"; G.qBubble.style.left=Math.max(w/2+12,Math.min(innerWidth-w/2-12,p.x))+"px"; const top=Math.min(G.qBubble.offsetHeight+66, p.y-8); G.qBubble.style.top=Math.max(G.qBubble.offsetHeight+66, top)+"px"; qBottom=parseFloat(G.qBubble.style.top)+8; } if(G.aBubble){ const p=project(player.userData.head,.75); const w=Math.min(400,innerWidth-24); G.aBubble.style.width=w+"px"; G.aBubble.style.left=Math.max(w/2+12,Math.min(innerWidth-w/2-12,p.x))+"px"; G.aBubble.style.top=Math.max(qBottom+G.aBubble.offsetHeight+10, p.y-8)+"px"; } }
    if((G.state==="doors"||G.state==="doorconfirm")&&G.doors){ G.doors.forEach(d=>{ d.rotation.z+=dt*.5; d.userData.disc.material.opacity=.15+Math.sin(t*2)*.08; const p=project(d,-2.3); d.userData.label.style.left=p.x+"px"; d.userData.label.style.top=(p.y+6)+"px"; if(G.state==="doors" && Math.hypot(d.position.x-P.x,d.position.z-P.z)<2.2){ enterDoor(d); } }); }
    if(G.state==="proof"&&G.doc){ G.doc.rotation.y+=dt*2; G.doc.position.y=1.3+Math.sin(t*3)*.15; const p=project(G.doc,1); G.doc.userData.label.style.left=p.x+"px"; G.doc.userData.label.style.top=p.y+"px"; if(Math.hypot(G.doc.position.x-P.x,G.doc.position.z-P.z)<1.3) pickProof(); }
    // camera follows from behind, slightly elevated
    const cx=P.x*.7, cz=P.z+8.5; camera.position.lerp(new THREE.Vector3(cx,5.2,cz),Math.min(1,dt*4)); camera.lookAt(P.x*.7,1.4,P.z-3);
  } else if(G.state==="dome"||G.state==="title"){
    animFigure(player,dt,"idle"); Object.values(cast).forEach(f=>animFigure(f,dt,"idle"));
    camera.position.lerp(new THREE.Vector3(Math.sin(t*.15)*1.5,4.2,10),dt); camera.lookAt(0,1.6,-1);
  }
  // speaking hop
  [player,...Object.values(cast),...(G.npcObjs?Object.values(G.npcObjs):[])].forEach(f=>{ if(!f) return; const u=f.userData; if(u.hop>0){ u.hop-=dt*2.2; f.position.y=Math.max(0,Math.sin(u.hop*Math.PI))*.5+(f===player?P.y:0); if(u.hop<=0){ u.hop=0; f.position.y=(f===player?P.y:0); } } });
  if(alarmOn){ alarmLight.intensity=1.5+Math.sin(t*6)*1.4; alarmLight.position.set(P.x,4,P.z-3); } else alarmLight.intensity=Math.max(0,alarmLight.intensity-dt*3);
  if(dlgActive) positionBubble();
  if(noRender) return; renderer.render(scene,camera); requestAnimationFrame(loop);
}

      + `<div class="ql">Parce que...</div><div class="ans">${m.why||"<span style='opacity:.5'>Pas encore choisi.</span>"}</div>` + (m.note?`<div class="ql">Note</div><div class="ans">${m.note}</div>`:"");
  } else if(tab==="preuves"){ const got=MISSIONS.filter(m=>mstate(m.id).choice); body=got.length?got.map(M=>{ const k=mstate(M.id).choice; return `<h3>Preuve ${M.id} · ${M.preuve.titre}</h3><pre style="font-family:var(--mono);background:#fff;border:1px solid #E6D6B8;border-radius:8px;padding:12px;white-space:pre-wrap;color:#2B4F7A">${M.preuve.doc}</pre>${k==="B"?`<div style="font-style:italic;color:#2E5E2B">${M.preuve.commentB}</div>`:`<div class="small" style="color:#8B6A3E">${M.preuve.maskedA}</div>`}<div style="height:14px"></div>`; }).join(""):`<h3>Preuves</h3><p>Aucune preuve pour l'instant.</p>`; }
  else if(tab==="principes"){ body=`<h3>Les dix principes de la Recommandation</h3><table>${PRINCIPES.map((p,i)=>{ const ok=MISSIONS[i]&&mstate(MISSIONS[i].id).done; return `<tr><td style="width:34px"><span class="tick ${ok?"on":""}">${ok?"✓":""}</span></td><td>${i+1}. ${p}</td><td class="small" style="color:#8B6A3E;text-align:right">${QUARTIERS[i]}</td></tr>`; }).join("")}</table>`; }
  else { body=`<h3>Jauges</h3><div class="ql" style="color:#2F6FC4">Confiance de FriendLoop · ${S.fl}</div><div class="gp"><i style="width:${S.fl}%;background:#5EA8FF"></i></div><div class="ql" style="color:#2E5E2B">Confiance des citoyens · ${S.cit}</div><div class="gp"><i style="width:${S.cit}%;background:#3E7D3A"></i></div><div class="ql">Fragments ✦ ${S.frags}</div><p class="small" style="color:#8B6A3E">Les deux jauges modifient les dialogues et la fin. Aucune ne fait perdre.</p>`; }
  carnet.classList.remove("hidden");
  carnet.innerHTML=`<div class="book" role="dialog"><nav>${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</nav><main>${body}</main><button class="close" id="cl">Fermer ✕</button></div>`;
  carnet.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openCarnet(b.dataset.t)); carnet.querySelectorAll(".mnav").forEach(b=>b.onclick=()=>openCarnet("missions",+b.dataset.m));
  carnet.querySelector("#cl").onclick=()=>carnet.classList.add("hidden"); carnet.onclick=e=>{ if(e.target===carnet) carnet.classList.add("hidden"); };
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") carnet.classList.add("hidden"); });

screenTitle();
</script>

</body>
</html>
